# Prometheus Configuration for vLLM FastAPI Monitoring
# This file configures Prometheus to scrape metrics from various services

global:
  scrape_interval: 15s       # How often to scrape targets
  evaluation_interval: 15s   # How often to evaluate rules

# Alert rules configuration
rule_files:
  - "/etc/prometheus/rules/*.yml"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s

  # Main FastAPI application
  - job_name: 'nemo-ai-fastapi'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          environment: 'production'
          service: 'nemo-ai-api'
          team: 'backend'
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 10s

  # System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          environment: 'production'
          service: 'system-metrics'
          instance: 'main-server'
    scrape_interval: 15s

  # GPU metrics (optional - uncomment if using GPU monitoring)
  # - job_name: 'dcgm-exporter'
  #   static_configs:
  #     - targets: ['dcgm-exporter:9400']
  #       labels:
  #         environment: 'production'
  #         service: 'gpu-metrics'
  #   scrape_interval: 10s
