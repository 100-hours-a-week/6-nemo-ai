# Alertmanager Configuration for vLLM FastAPI Monitoring
# This file configures how alerts are routed and sent to notification channels

# Global configuration
global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@nemo-ai.com'
  resolve_timeout: 5m

# Templates for notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Routing tree for alerts
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default-notifications'
  
  # Route specific alerts to different receivers
  routes:
    # Critical alerts go to immediate notification channels
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 5s
      repeat_interval: 5m
    
    # Warning alerts go to standard channels
    - match:
        severity: warning
      receiver: 'warning-alerts'
      repeat_interval: 30m
    
    # Team-specific routing
    - match:
        team: ai
      receiver: 'ai-team-alerts'
    
    - match:
        team: infrastructure
      receiver: 'infra-team-alerts'

# Notification receivers
receivers:
  # Default fallback receiver
  - name: 'default-notifications'
    webhook_configs:
      - url: '${ALERT_WEBHOOK_URL}'
        send_resolved: true
        title: 'vLLM Monitoring Alert'
        text: |
          🔔 **Alert Notification**
          {{ range .Alerts }}
          **Alert:** {{ .Annotations.summary }}
          **Description:** {{ .Annotations.description }}
          **Severity:** {{ .Labels.severity }}
          **Status:** {{ .Status }}
          {{ end }}

  # Critical alerts - immediate notifications
  - name: 'critical-alerts'
    discord_configs:
      - webhook_url: '${ALERT_WEBHOOK_URL}'
        title: '🚨 CRITICAL ALERT - Immediate Action Required'
        message: |
          **🚨 CRITICAL SYSTEM ALERT 🚨**
          
          {{ range .Alerts }}
          **🔥 Alert:** {{ .Annotations.summary }}
          **📝 Description:** {{ .Annotations.description }}
          **⚠️ Severity:** {{ .Labels.severity | toUpper }}
          **🏷️ Service:** {{ .Labels.service }}
          **👥 Team:** {{ .Labels.team }}
          **🕐 Started:** {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          **📊 Status:** {{ .Status | toUpper }}
          {{ if .Annotations.runbook_url }}**📖 Runbook:** {{ .Annotations.runbook_url }}{{ end }}
          {{ end }}
          
          **🎯 Action Required:** Please investigate immediately!
        color: 16711680  # Red

  # Warning alerts - standard notifications
  - name: 'warning-alerts'
    discord_configs:
      - webhook_url: '${ALERT_WEBHOOK_URL}'
        title: '⚠️ Warning Alert - Attention Needed'
        message: |
          **⚠️ System Warning**
          
          {{ range .Alerts }}
          **⚠️ Alert:** {{ .Annotations.summary }}
          **📝 Description:** {{ .Annotations.description }}
          **🏷️ Service:** {{ .Labels.service }}
          **👥 Team:** {{ .Labels.team }}
          **🕐 Started:** {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          **📊 Status:** {{ .Status | toUpper }}
          {{ if .Annotations.runbook_url }}**📖 Runbook:** {{ .Annotations.runbook_url }}{{ end }}
          {{ end }}
        color: 16776960  # Yellow

  # AI team specific alerts
  - name: 'ai-team-alerts'
    discord_configs:
      - webhook_url: '${ALERT_WEBHOOK_URL}'
        title: '🤖 AI Team Alert'
        message: |
          **🤖 AI System Alert**
          
          {{ range .Alerts }}
          **Alert:** {{ .Annotations.summary }}
          **Model/Service:** {{ .Labels.service }}
          **Description:** {{ .Annotations.description }}
          **Severity:** {{ .Labels.severity }}
          **Time:** {{ .StartsAt.Format "15:04:05" }}
          {{ end }}
        color: 3447003  # Blue

  # Infrastructure team specific alerts
  - name: 'infra-team-alerts'
    discord_configs:
      - webhook_url: '${ALERT_WEBHOOK_URL}'
        title: '🏗️ Infrastructure Alert'
        message: |
          **🏗️ Infrastructure Alert**
          
          {{ range .Alerts }}
          **System:** {{ .Labels.service }}
          **Issue:** {{ .Annotations.summary }}
          **Details:** {{ .Annotations.description }}
          **Severity:** {{ .Labels.severity }}
          **Time:** {{ .StartsAt.Format "15:04:05" }}
          {{ end }}
        color: 10181046  # Purple

# Inhibition rules - prevent spam when multiple related alerts fire
inhibit_rules:
  # If service is down, don't alert on high error rate
  - source_match:
      alertname: 'ServiceDown'
    target_match:
      alertname: 'HighErrorRate'
    equal: ['service']

  # If critical alert is firing, suppress related warnings
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service', 'instance']

