[pytest]
minversion = 6.0
addopts = -ra -q --strict-markers --strict-config
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (database, API, external services)
    e2e: End-to-end tests (full application flows)
    slow: Slow running tests
    kafka: Tests that require Kafka
    vector: Tests that require vector database
    llm: Tests that require LLM services
    websocket: Tests that require WebSocket connections
    chatbot: Tests that require chatbot functionality
    asyncio: Async tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pydantic.warnings.PydanticDeprecatedSince20
