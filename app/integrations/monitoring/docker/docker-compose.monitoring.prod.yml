services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ../config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-data:/prometheus
      - ../config/prometheus-rules.yml:/etc/prometheus/rules/prometheus-rules.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME}'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--log.level=warn'
    restart: unless-stopped
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ./grafana-data:/var/lib/grafana
      - ../grafana-provisioning:/etc/grafana/provisioning
      - ./grafana-logs:/var/log/grafana
    environment:
      # Admin credentials - REQUIRED from .env file
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      # Security settings - REQUIRED from .env file
      - GF_USERS_ALLOW_SIGN_UP=${GF_USERS_ALLOW_SIGN_UP}
      - GF_USERS_ALLOW_ORG_CREATE=${GF_USERS_ALLOW_ORG_CREATE}
      - GF_USERS_AUTO_ASSIGN_ORG=${GF_USERS_AUTO_ASSIGN_ORG}
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=${GF_USERS_AUTO_ASSIGN_ORG_ROLE}
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED}
      - GF_AUTH_BASIC_ENABLED=${GF_AUTH_BASIC_ENABLED}
      - GF_AUTH_DISABLE_LOGIN_FORM=${GF_AUTH_DISABLE_LOGIN_FORM}
      - GF_AUTH_DISABLE_SIGNOUT_MENU=${GF_AUTH_DISABLE_SIGNOUT_MENU}
      - GF_SECURITY_DISABLE_GRAVATAR=${GF_SECURITY_DISABLE_GRAVATAR}
      - GF_SECURITY_COOKIE_SECURE=${GF_SECURITY_COOKIE_SECURE}
      - GF_SECURITY_COOKIE_SAMESITE=${GF_SECURITY_COOKIE_SAMESITE}
      - GF_SECURITY_CONTENT_TYPE_PROTECTION=${GF_SECURITY_CONTENT_TYPE_PROTECTION}
      - GF_SECURITY_X_CONTENT_TYPE_OPTIONS=${GF_SECURITY_X_CONTENT_TYPE_OPTIONS}
      - GF_SECURITY_X_XSS_PROTECTION=${GF_SECURITY_X_XSS_PROTECTION}
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY=${GF_SECURITY_STRICT_TRANSPORT_SECURITY}
      - GF_LOG_LEVEL=${GF_LOG_LEVEL}
      - GF_LOG_MODE=${GF_LOG_MODE}
      - GF_PATHS_LOGS=${GF_PATHS_LOGS}
    restart: unless-stopped
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    user: "472:472"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "${NODE_EXPORTER_PORT}:9100"
    command:
      - '--web.listen-address=:9100'
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    read_only: true

  # Backup service for Prometheus data
  prometheus-backup:
    image: alpine:latest
    container_name: prometheus-backup
    volumes:
      - ./prometheus-data:/data:ro
      - ./backups:/backups
    command: >
      sh -c "
        while true; do
          tar -czf /backups/prometheus-backup-$$(date +%Y%m%d-%H%M%S).tar.gz -C /data .
          find /backups -name 'prometheus-backup-*.tar.gz' -mtime +7 -delete
          sleep 86400
        done
      "
    restart: unless-stopped
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
    name: ${MONITORING_NETWORK}
