name: AI CI/CD - Build & Deploy

on:
  push:
    branches: [ infra/cicd ]

jobs:
  build-and-deploy:
    name: Build & Deploy AI + VLLM
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-northeast-2
      SERVICE: ai
      ENVIRONMENT: dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set image tag and URI
        run: |
          TIME_TAG="${{ env.ENVIRONMENT }}-$(TZ=Asia/Seoul date +'%Y%m%d-%H%M')"
          echo "TIME_TAG=$TIME_TAG" >> $GITHUB_ENV
          
          IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.SERVICE }}"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Get current date
        id: date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Build and Push Docker Image to ECR
        run: |
          echo "🔨 Building Docker image..."
          docker build -t "${IMAGE_URI}:${TIME_TAG}" .
          
          echo "📦 Pushing to ECR..."
          docker push "${IMAGE_URI}:${TIME_TAG}"

      - name: Output image info
        run: |
          echo "🚀 AI Image pushed successfully!"
          echo "📦 Image URI: ${IMAGE_URI}:${TIME_TAG}"

      - name: Deploy to EC2 Server
        run: |
          # SSH 키 설정
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          
          # 서버에 SSH 접속하여 배포
          ssh -i private_key.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
          
            echo "🚀 Starting deployment process..."
          
            # 배포 스크립트 실행
            cd /home/ubuntu/nemo
          
            # 스크립트에 실행 권한 부여
            chmod +x deploy.sh
          
            # 배포 스크립트 실행
            ./deploy.sh ${{ env.TIME_TAG }}
          
            echo "🎉 배포 완료! 이미지: ${{ env.TIME_TAG }}"
          EOF
          
          # 정리
          rm -f private_key.pem

      - name: Verify Deployment
        run: |
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          
          ssh -i private_key.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            echo "🔍 배포 상태 확인..."
          
            # 컨테이너 상태 확인
            echo "📊 컨테이너 상태:"
            docker ps | grep -E "(ai-prod|vllm)"
          
            # AI 서비스 헬스체크
            echo "🏥 AI 서비스 헬스체크..."
            for i in {1..5}; do
              if curl -f http://localhost:8000/health > /dev/null 2>&1; then
                echo "✅ AI 서비스 정상 (시도 $i/5)"
                break
              elif [ $i -eq 5 ]; then
                echo "❌ AI 서비스 헬스체크 실패"
                docker logs --tail 20 ai-prod
                exit 1
              else
                echo "⏳ AI 서비스 헬스체크 재시도 ($i/5)..."
                sleep 10
              fi
            done
          
            # VLLM 서비스 헬스체크
            echo "🤖 VLLM 서비스 헬스체크..."
            for i in {1..3}; do
              if curl -f http://localhost:8002/v1/models > /dev/null 2>&1; then
                echo "✅ VLLM 서비스 정상 (시도 $i/3)"
                break
              elif [ $i -eq 3 ]; then
                echo "❌ VLLM 서비스 헬스체크 실패"
                docker logs --tail 20 vllm
                exit 1
              else
                echo "⏳ VLLM 서비스 헬스체크 재시도 ($i/3)..."
                sleep 15
              fi
            done
          
            echo "✅ 모든 서비스 정상 동작 확인!"
          EOF
          
          rm -f private_key.pem

      - name: Notify Deployment Status
        run: |
          echo "🚀 배포 완료!"
          echo "📦 새 이미지: ${{ env.TIME_TAG }}"

      - name: Discord Notification - Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "embeds": [{
                "title": "🚀 AI 배포 성공!",
                "description": "새로운 AI 서비스가 성공적으로 배포되었습니다.",
                "color": 3066993,
                "fields": [
                  {
                    "name": "📦 이미지 태그",
                    "value": "${{ env.TIME_TAG }}",
                    "inline": true
                  },
                  {
                    "name": "🌐 AI 서비스",
                    "value": "http://${{ secrets.EC2_HOST }}:8000",
                    "inline": true
                  },
                  {
                    "name": "🤖 VLLM 서비스",
                    "value": "http://${{ secrets.EC2_HOST }}:8002",
                    "inline": true
                  },
                  {
                    "name": "👤 배포자",
                    "value": "${{ github.actor }}",
                    "inline": true
                  },
                  {
                    "name": "🔗 커밋",
                    "value": "[${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})",
                    "inline": true
                  }
                ],
                "timestamp": "${{ steps.date.outputs.date }}",
                "footer": {
                  "text": "AI CI/CD Pipeline"
                }
              }]
            }' \
            https://discord.com/api/webhooks/1372113045471498250/al6sPD-f9AzhQiQslu3EjnsSq8iK1aEQJMT8vqLLEbGiPg2I53O_2Xx60PcxVTqmELio

      - name: Discord Notification - Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "embeds": [{
                "title": "❌ AI 배포 실패!",
                "description": "AI 서비스 배포 중 오류가 발생했습니다.",
                "color": 15158332,
                "fields": [
                  {
                    "name": "📦 시도한 이미지",
                    "value": "${{ env.TIME_TAG }}",
                    "inline": true
                  },
                  {
                    "name": "👤 배포자",
                    "value": "${{ github.actor }}",
                    "inline": true
                  },
                  {
                    "name": "🔗 실패한 워크플로우",
                    "value": "[로그 확인](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                    "inline": true
                  }
                ],
                "timestamp": "${{ steps.date.outputs.date }}",
                "footer": {
                  "text": "AI CI/CD Pipeline"
                }
              }]
            }' \
            https://discord.com/api/webhooks/1372113045471498250/al6sPD-f9AzhQiQslu3EjnsSq8iK1aEQJMT8vqLLEbGiPg2I53O_2Xx60PcxVTqmELio