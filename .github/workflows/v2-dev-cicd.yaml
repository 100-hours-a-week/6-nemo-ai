name: AI CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      version:
        description: '릴리즈 버전 태그 (예: v1.3.0)'
        required: true

jobs:
  build:
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.set-tag.outputs.IMAGE_TAG }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set image tag
        id: set-tag
        run: |
          TIME_TAG="prod-$(TZ=Asia/Seoul date +'%Y%m%d-%H%M')"
          echo "IMAGE_TAG=$TIME_TAG" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=$TIME_TAG" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        run: |
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE_URI="${ECR_REGISTRY}/ai"
          
          echo "Building and pushing image: ${IMAGE_URI}:${IMAGE_TAG}"
          
          docker build -t "${IMAGE_URI}:${IMAGE_TAG}" .
          docker tag "${IMAGE_URI}:${IMAGE_TAG}" "${IMAGE_URI}:latest"
          
          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          docker push "${IMAGE_URI}:latest"

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # 배포 스크립트 실행
            bash ~/nemo/deploy.sh ${{ needs.build.outputs.image-tag }}

      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # 컨테이너 상태 확인
            echo "=== Container Status ==="
            docker ps | grep ai-prod
            
            # 로그 확인
            echo "=== Recent Logs ==="
            docker logs ai-prod --tail=10
            
            # 헬스체크
            echo "=== Health Check ==="
            curl -f http://localhost:8000/health || echo "Health check failed"

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: failure()

    steps:
      - name: Rollback to Previous Version
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "🔄 Rolling back to previous version..."
            bash ~/nemo/deploy.sh latest