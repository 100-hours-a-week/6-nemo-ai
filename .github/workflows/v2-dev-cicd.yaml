name: AI CI/CD - Build & Deploy

on:
  push:
    branches: [ infra/cicd ]

jobs:
  build-and-deploy:
    name: Build & Deploy AI + VLLM
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-northeast-2
      SERVICE: ai
      ENVIRONMENT: dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set image tag and URI
        run: |
          TIME_TAG="${{ env.ENVIRONMENT }}-$(TZ=Asia/Seoul date +'%Y%m%d-%H%M')"
          echo "TIME_TAG=$TIME_TAG" >> $GITHUB_ENV
          
          IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.SERVICE }}"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Get current date
        id: date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Build and Push Docker Image to ECR
        run: |
          docker build -t "${IMAGE_URI}:${TIME_TAG}" .
          docker push "${IMAGE_URI}:${TIME_TAG}"

      - name: Output image info
        run: |
          echo "🚀 AI Image pushed successfully!"
          echo "📦 Image URI: ${IMAGE_URI}:${TIME_TAG}"

      - name: Deploy to EC2 Server
        run: |
          # SSH 키 설정
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          
          # 서버에 SSH 접속하여 배포
          ssh -i private_key.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
          
            echo "🔑 ECR 로그인..."
            aws ecr get-login-password --region ap-northeast-2 | \
              docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com
          
            echo "📦 최신 이미지 pull..."
            docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com/ai:${{ env.TIME_TAG }}
          
            echo "📝 docker-compose.yml 업데이트..."
            cd /home/ubuntu/nemo
            sed -i "s|084375578827.dkr.ecr.ap-northeast-2.amazonaws.com/ai:.*|${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com/ai:${{ env.TIME_TAG }}|g" docker-compose.yml
          
            echo "🚀 서비스 재시작..."
            docker-compose down
            docker-compose up -d ai-prod vllm
          
            echo "⏰ 서비스 시작 대기..."
            sleep 15
          
            echo "🏥 헬스체크..."
            curl -f http://localhost:8000 && echo "✅ AI 서비스 정상" || echo "❌ AI 서비스 오류"
            curl -f http://localhost:8002/v1/models && echo "✅ VLLM 서비스 정상" || echo "❌ VLLM 서비스 오류"
          
            echo "📊 실행 상태:"
            docker-compose ps
          
            echo "🎉 배포 완료! 이미지: ${{ env.TIME_TAG }}"
          EOF
          
          # 정리
          rm -f private_key.pem

      - name: Notify Deployment Status
        run: |
          echo "🚀 배포 완료!"
          echo "📦 새 이미지: ${{ env.TIME_TAG }}"
          echo "🌐 AI 서비스: http://${{ secrets.EC2_HOST }}:8000"
          echo "🤖 VLLM 서비스: http://${{ secrets.EC2_HOST }}:8002"

      - name: Discord Notification - Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "embeds": [{
                "title": "🚀 AI 배포 성공!",
                "description": "새로운 AI 서비스가 성공적으로 배포되었습니다.",
                "color": 3066993,
                "fields": [
                  {
                    "name": "📦 이미지 태그",
                    "value": "${{ env.TIME_TAG }}",
                    "inline": true
                  },
                  {
                    "name": "🌐 AI 서비스",
                    "value": "http://${{ secrets.EC2_HOST }}:8000",
                    "inline": true
                  },
                  {
                    "name": "🤖 VLLM 서비스",
                    "value": "http://${{ secrets.EC2_HOST }}:8002",
                    "inline": true
                  },
                  {
                    "name": "👤 배포자",
                    "value": "${{ github.actor }}",
                    "inline": true
                  },
                  {
                    "name": "🔗 커밋",
                    "value": "[${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})",
                    "inline": true
                  }
                ],
                "timestamp": "${{ steps.date.outputs.date }}",
                "footer": {
                  "text": "AI CI/CD Pipeline"
                }
              }]
            }' \
            https://discord.com/api/webhooks/1372113045471498250/al6sPD-f9AzhQiQslu3EjnsSq8iK1aEQJMT8vqLLEbGiPg2I53O_2Xx60PcxVTqmELio


      - name: Discord Notification - Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "embeds": [{
                "title": "❌ AI 배포 실패!",
                "description": "AI 서비스 배포 중 오류가 발생했습니다.",
                "color": 15158332,
                "fields": [
                  {
                    "name": "📦 시도한 이미지",
                    "value": "${{ env.TIME_TAG }}",
                    "inline": true
                  },
                  {
                    "name": "👤 배포자",
                    "value": "${{ github.actor }}",
                    "inline": true
                  },
                  {
                    "name": "🔗 실패한 워크플로우",
                    "value": "[로그 확인](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                    "inline": true
                  }
                ],
                "timestamp": "${{ steps.date.outputs.date }}",
                "footer": {
                  "text": "AI CI/CD Pipeline"
                }
              }]
            }' \
            https://discord.com/api/webhooks/1372113045471498250/al6sPD-f9AzhQiQslu3EjnsSq8iK1aEQJMT8vqLLEbGiPg2I53O_2Xx60PcxVTqmELio